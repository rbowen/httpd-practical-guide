<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" font-family="'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2980b9"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Virtual Host Matching Algorithm</text>
  <text x="380" y="48" text-anchor="middle" font-size="12" fill="#666">Two-phase selection: IP:port first, then Host header</text>

  <!-- ═══ CONNECTION ARRIVES ═══ -->
  <rect x="265" y="66" width="230" height="36" rx="18" fill="#2c3e50" stroke="none"/>
  <text x="380" y="89" text-anchor="middle" fill="white" font-weight="bold" font-size="14">Connection arrives</text>

  <!-- Arrow down -->
  <line x1="380" y1="102" x2="380" y2="132" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ PHASE 1 BOX ═══ -->
  <rect x="55" y="132" width="650" height="290" rx="8" fill="none" stroke="#2980b9" stroke-width="2"/>
  <rect x="55" y="132" width="650" height="26" rx="8" fill="#2980b9" stroke="none"/>
  <rect x="55" y="150" width="650" height="8" fill="#2980b9" stroke="none"/>
  <text x="80" y="152" font-size="13" font-weight="bold" fill="white">PHASE 1: Match destination IP address and port</text>

  <!-- Priority table -->
  <rect x="85" y="172" width="590" height="150" rx="4" fill="#eaf2f8" stroke="#aed6f1" stroke-width="1"/>

  <!-- Header row -->
  <text x="105" y="192" font-size="11" font-weight="bold" fill="#2c3e50">Priority</text>
  <text x="185" y="192" font-size="11" font-weight="bold" fill="#2c3e50">Match type</text>
  <text x="420" y="192" font-size="11" font-weight="bold" fill="#2c3e50">Example</text>
  <line x1="95" y1="198" x2="665" y2="198" stroke="#aed6f1" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="125" y="216" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="185" y="216" font-size="12" fill="#333">Exact IP, exact port</text>
  <text x="420" y="216" font-size="11" fill="#555" font-family="'Courier New', monospace">&lt;VirtualHost 10.0.0.1:80&gt;</text>

  <!-- Row 2 -->
  <text x="125" y="238" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="185" y="238" font-size="12" fill="#333">Exact IP, wildcard port</text>
  <text x="420" y="238" font-size="11" fill="#555" font-family="'Courier New', monospace">&lt;VirtualHost 10.0.0.1:*&gt;</text>

  <!-- Row 3 -->
  <text x="125" y="260" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="185" y="260" font-size="12" fill="#333">Wildcard address, exact port</text>
  <text x="420" y="260" font-size="11" fill="#555" font-family="'Courier New', monospace">&lt;VirtualHost *:80&gt;</text>

  <!-- Row 4 -->
  <text x="125" y="282" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="185" y="282" font-size="12" fill="#333">Wildcard address, wildcard port</text>
  <text x="420" y="282" font-size="11" fill="#555" font-family="'Courier New', monospace">&lt;VirtualHost *:*&gt;</text>

  <!-- Row 5 -->
  <text x="125" y="304" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="185" y="304" font-size="12" fill="#333">Main server (no VirtualHost matched)</text>
  <text x="420" y="304" font-size="11" fill="#888" font-style="italic">falls through to global config</text>

  <!-- Diamond: How many matched? -->
  <polygon points="380,340 500,372 380,404 260,372" fill="#fff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="380" y="369" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="bold">How many</text>
  <text x="380" y="383" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="bold">matched?</text>

  <!-- Exactly one → serve directly -->
  <line x1="500" y1="372" x2="620" y2="372" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="545" y="364" font-size="11" fill="#27ae60" font-weight="bold">Exactly 1</text>
  <rect x="620" y="356" width="75" height="32" rx="16" fill="#27ae60" stroke="none"/>
  <text x="657" y="377" text-anchor="middle" fill="white" font-weight="bold" font-size="12">Serve ✓</text>

  <!-- Multiple → Phase 2 -->
  <line x1="380" y1="404" x2="380" y2="448" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="395" y="430" font-size="11" fill="#2980b9" font-weight="bold">Multiple</text>

  <!-- ═══ PHASE 2 BOX ═══ -->
  <rect x="55" y="448" width="650" height="280" rx="8" fill="none" stroke="#8e44ad" stroke-width="2"/>
  <rect x="55" y="448" width="650" height="26" rx="8" fill="#8e44ad" stroke="none"/>
  <rect x="55" y="466" width="650" height="8" fill="#8e44ad" stroke="none"/>
  <text x="80" y="468" font-size="13" font-weight="bold" fill="white">PHASE 2: Name-based matching (Host header / SNI)</text>

  <!-- Step: Get hostname -->
  <rect x="175" y="488" width="410" height="32" rx="5" fill="#f4ecf7" stroke="#d2b4de" stroke-width="1"/>
  <text x="380" y="509" text-anchor="middle" fill="#6c3483" font-size="12">Read hostname from Host header (HTTP) or SNI (TLS handshake)</text>

  <!-- Arrow down -->
  <line x1="380" y1="520" x2="380" y2="548" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step: Compare -->
  <rect x="155" y="548" width="450" height="32" rx="5" fill="#f4ecf7" stroke="#d2b4de" stroke-width="1"/>
  <text x="380" y="569" text-anchor="middle" fill="#6c3483" font-size="12">Compare against ServerName &amp; ServerAlias (config file order)</text>

  <!-- Arrow down -->
  <line x1="380" y1="580" x2="380" y2="608" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond: Match found? -->
  <polygon points="380,608 480,638 380,668 280,638" fill="#fff" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="380" y="635" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="bold">Name</text>
  <text x="380" y="649" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="bold">match?</text>

  <!-- Yes → serve -->
  <line x1="480" y1="638" x2="620" y2="638" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="540" y="630" font-size="11" fill="#27ae60" font-weight="bold">Yes</text>
  <rect x="620" y="622" width="75" height="32" rx="16" fill="#27ae60" stroke="none"/>
  <text x="657" y="643" text-anchor="middle" fill="white" font-weight="bold" font-size="12">Serve ✓</text>

  <!-- No → default vhost -->
  <line x1="380" y1="668" x2="380" y2="700" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="688" font-size="11" fill="#c0392b" font-weight="bold">No</text>

  <rect x="240" y="700" width="280" height="20" rx="4" fill="#fdedec" stroke="#e74c3c" stroke-width="1"/>
  <text x="380" y="715" text-anchor="middle" fill="#c0392b" font-size="12" font-weight="bold">Use first vhost at this priority level (the default)</text>

  <!-- ═══ BOTTOM NOTES ═══ -->
  <rect x="55" y="748" width="650" height="62" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="75" y="770" font-size="12" font-weight="bold" fill="#2c3e50">Key points:</text>
  <text x="75" y="788" font-size="11.5" fill="#333">• Phase 1 priority is strict — once matched at a level, lower levels are ignored entirely.</text>
  <text x="75" y="804" font-size="11.5" fill="#333">• Phase 2 only runs when multiple vhosts tie at Phase 1. The first listed vhost is the default.</text>
</svg>