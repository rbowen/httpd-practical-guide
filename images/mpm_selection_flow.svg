<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <style>
    text { font-family: sans-serif; font-size: 13px; fill: #333; }
    .question { font-weight: bold; font-size: 12px; }
    .answer { font-size: 14px; font-weight: bold; fill: #1a5276; }
    .yesno { font-size: 11px; fill: #666; font-style: italic; }
    rect.box { fill: #f0f4f8; stroke: #2c3e50; stroke-width: 1.5; rx: 6; }
    rect.result { fill: #d4efdf; stroke: #1e8449; stroke-width: 2; rx: 6; }
    line, polyline { stroke: #555; stroke-width: 1.5; fill: none; }
    marker { fill: #555; }
  </style>
  
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Question 1: Threads? -->
  <rect class="box" x="140" y="20" width="220" height="50"/>
  <text class="question" x="250" y="42" text-anchor="middle">Does the system</text>
  <text class="question" x="250" y="57" text-anchor="middle">support threads?</text>
  
  <!-- No -> prefork -->
  <line x1="140" y1="45" x2="60" y2="45" marker-end="url(#arrow)"/>
  <text class="yesno" x="110" y="38">No</text>
  <rect class="result" x="0" y="30" width="60" height="30"/>
  <text class="answer" x="30" y="50" text-anchor="middle">prefork</text>
  
  <!-- Yes -> Question 2 -->
  <line x1="250" y1="70" x2="250" y2="130" marker-end="url(#arrow)"/>
  <text class="yesno" x="258" y="100">Yes</text>
  
  <!-- Question 2: epoll/kqueue? -->
  <rect class="box" x="115" y="130" width="270" height="50"/>
  <text class="question" x="250" y="152" text-anchor="middle">Does the system support</text>
  <text class="question" x="250" y="167" text-anchor="middle">thread-safe polling (kqueue/epoll)?</text>
  
  <!-- No -> worker -->
  <line x1="115" y1="155" x2="50" y2="155" marker-end="url(#arrow)"/>
  <text class="yesno" x="75" y="148">No</text>
  <rect class="result" x="0" y="140" width="50" height="30"/>
  <text class="answer" x="25" y="160" text-anchor="middle">worker</text>
  
  <!-- Yes -> event -->
  <line x1="250" y1="180" x2="250" y2="230" marker-end="url(#arrow)"/>
  <text class="yesno" x="258" y="210">Yes</text>
  <rect class="result" x="200" y="230" width="100" height="35"/>
  <text class="answer" x="250" y="253" text-anchor="middle">event</text>
  
  <!-- Note -->
  <text x="250" y="295" text-anchor="middle" font-size="11" fill="#666">(In practice, all modern Linux/BSD/macOS systems</text>
  <text x="250" y="310" text-anchor="middle" font-size="11" fill="#666">support both — so the default is almost always event.)</text>

</svg>
